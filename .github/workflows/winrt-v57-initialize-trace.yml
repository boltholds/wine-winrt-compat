name: WinRT v57 diagnostic-only CoreApplicationView trace

on:
  push:
    branches: [experiment/winrt-v57-initialize-trace]
    paths:
      - "dlls/twinapi.appcore/**"
      - "probes/v57/**"
      - ".github/workflows/winrt-v57-initialize-trace.yml"
  pull_request:
    branches: [experiment/winrt-v56-framework-lifecycle]
    paths:
      - "dlls/twinapi.appcore/**"
      - "probes/v57/**"
      - ".github/workflows/winrt-v57-initialize-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify diagnostic-only tracing
        run: python3 -m unittest discover -s probes/v57/tests -v
      - name: Install Wine PE64 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxcomposite-dev libxfixes-dev libfreetype-dev
      - name: Configure Wine 11.19 PE64
        run: |
          mkdir build-pe64
          cd build-pe64
          ../configure --enable-win64 --with-mingw --disable-tests
      - name: Compile instrumented twinapi.appcore.dll
        run: |
          make -C build-pe64 -j4 dlls/twinapi.appcore/x86_64-windows/twinapi.appcore.dll
          file build-pe64/dlls/twinapi.appcore/x86_64-windows/twinapi.appcore.dll | grep -q 'PE32+'
          sha256sum build-pe64/dlls/twinapi.appcore/x86_64-windows/twinapi.appcore.dll
