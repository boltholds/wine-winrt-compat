name: WinRT v56 FrameworkView lifecycle experimental PE64

on:
  push:
    branches: [experiment/winrt-v56-framework-lifecycle]
    paths:
      - "dlls/twinapi.appcore/**"
      - "dlls/windows.ui/**"
      - "probes/v56/**"
      - ".github/workflows/winrt-v56-framework-lifecycle.yml"
  pull_request:
    branches: [experiment/winrt-v55-corewindow]
    paths:
      - "dlls/twinapi.appcore/**"
      - "dlls/windows.ui/**"
      - "probes/v56/**"
      - ".github/workflows/winrt-v56-framework-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-verify-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate recorded lifecycle tests
        run: python3 -m unittest discover -s probes/v56/tests -v
      - name: Install Wine PE64 build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flex bison gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxcomposite-dev libxfixes-dev libfreetype-dev
      - name: Configure isolated Wine 11.19
        run: |
          mkdir build-pe64
          cd build-pe64
          ../configure --enable-win64 --with-mingw --disable-tests
      - name: Compile twinapi.appcore.dll and windows.ui.dll
        run: |
          make -C build-pe64 -j4 \
            dlls/twinapi.appcore/x86_64-windows/twinapi.appcore.dll \
            dlls/windows.ui/x86_64-windows/windows.ui.dll
          file build-pe64/dlls/twinapi.appcore/x86_64-windows/twinapi.appcore.dll | grep -q "PE32+"
          file build-pe64/dlls/windows.ui/x86_64-windows/windows.ui.dll | grep -q "PE32+"
      - name: Cross-compile complete Win64 FrameworkView mock
        run: |
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Wno-unused-parameter -Wno-cast-function-type \
            -Ibuild-pe64/include -Iinclude \
            -o /tmp/v56_full_mock.exe probes/v56/full_frameworkview_mock.c \
            build-pe64/dlls/combase/x86_64-windows/libcombase.a -lole32 -luser32 -luuid
          file /tmp/v56_full_mock.exe | grep -q "PE32+"
          sha256sum /tmp/v56_full_mock.exe
